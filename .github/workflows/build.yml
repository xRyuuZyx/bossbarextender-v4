
name: Build BossBar Extender All-Rows Fit

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: gradle build

      - name: Select runtime mod JAR
        shell: bash
        run: |
          mkdir -p release
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name 'bossbar-extender-*.jar' ! -name '*-sources.jar' -print -quit)"
          if [ -z "$JAR_FILE" ]; then
            echo "Runtime mod JAR not found"
            exit 1
          fi
          cp "$JAR_FILE" release/

      - name: Upload client mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BossBarExtender-AllRows-Fit
          path: release/*.jar
          if-no-files-found: error
